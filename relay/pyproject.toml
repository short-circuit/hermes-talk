[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-talk-relay"
version = "0.1.0"
description = "Local-only voice relay service for Hermes Talk"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "pypdf>=6.21",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.9",
    "numpy>=1.26",
    "av>=12",
]
speech = [
    "sherpa-onnx>=1.10",
    "kokoro-onnx>=0.3",
    "faster-whisper>=1.0",
    "numpy>=1.26",
    "av>=12",
]

[tool.setuptools]
packages = ["relay", "relay.auth", "relay.brain", "relay.logging", "relay.speech", "relay.storage", "relay.api", "relay.maintenance", "relay.transport"]
package-dir = {relay = "."}

[tool.setuptools.package-data]
relay = ["brain/tools.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:relay.*"]
markers = [
    "integration: exercises real local speech models and skips without them",
]
