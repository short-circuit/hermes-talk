name: ci

# Runs on every branch and every pull request so a leak cannot sit unmerged
# without a red check. `main` is protected on the same two jobs.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only required for organisation-owned repositories; ignored for personal accounts.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  hygiene:
    name: hygiene (PII, home paths, LAN IPs, .env, large files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # A tag must carry exactly the version the sources declare, and the
      # sources must agree with each other on every branch.
      - name: Version consistency
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            bash scripts/check_version.sh "${GITHUB_REF_NAME#v}"
          else
            bash scripts/check_version.sh
          fi
      # The wheel ships relay/LICENSE; it must stay byte-identical to the
      # repository licence it mirrors.
      - name: Licence copies agree
        run: cmp LICENSE relay/LICENSE
      # Proves the gate still fails on planted data before it is trusted to pass.
      - name: Gate self-test (planted fixtures must be rejected)
        run: bash scripts/check_repo_hygiene.sh --self-test
      - name: Repository hygiene
        run: bash scripts/check_repo_hygiene.sh

  python:
    name: python (lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./relay[dev]"
      - name: Lint
        run: |
          mapfile -t files < <(git ls-files '*.py')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no Python sources yet"
          else
            ruff check "${files[@]}"
            ruff format --check "${files[@]}"
          fi
      - name: Tests
        run: |
          if [ -d relay/tests ]; then
            pytest -q relay/tests
          else
            echo "no tests yet"
          fi

  android:
    name: android (gradle test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ hashFiles('android/gradlew') != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - run: cd android && ./gradlew test --no-daemon

  # Runs the self-contained instrumentation suite on a real emulator. The
  # upload-retry, token-expiry and call-state tests use an in-process loopback
  # fixture, so no host service is required beyond the stub relay used by the
  # end-to-end flow. The wake-word battery test is excluded by annotation; the
  # screen-off call window is shortened to keep the job inside its budget.
  android-instrumentation:
    name: android (emulator instrumentation)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ hashFiles('android/gradlew') != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Stub relay environment
        run: |
          python3 -m venv relay-venv
          relay-venv/bin/pip install --quiet aiortc
      - name: Instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
          script: |
            relay-venv/bin/python android/stub-relay/relay.py --port 8790 &
            for attempt in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8790/health > /dev/null; then break; fi
              sleep 1
            done
            adb reverse tcp:8790 tcp:8790
            cd android
            ./gradlew :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.notAnnotation=androidx.test.filters.LargeTest \
              -Pandroid.testInstrumentationRunnerArguments.screenOffSeconds=15 \
              --console=plain
